name: Bug report
description: Something in HomeStral does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please remove API keys and any personal data from logs before posting.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have searched the existing issues and discussions for a duplicate report.
          required: true
        - label: I have redacted API keys and personal data from everything below.
          required: true
  - type: checkboxes
    id: regression
    attributes:
      label: Regression
      options:
        - label: This worked in a previous version of HomeStral (please mention which one in "Additional context").
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: homestral-version
    attributes:
      label: HomeStral version
      placeholder: "0.6.0"
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: "2026.2.3"
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - HACS
        - Manual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (redacted)
      description: Enable debug logging for `custom_components.homestral` and paste the relevant lines.
      render: text
  - type: textarea
    id: diagnostics
    attributes:
      label: Additional context
      description: Model in use, agent or not, STT/TTS pipeline configuration, anything else useful.
