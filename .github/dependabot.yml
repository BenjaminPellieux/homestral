version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "BenjaminPellieux"
    groups:
      # The CodeQL action refuses a workflow whose steps mix major versions, and
      # dependabot treats every action path as its own dependency, so init,
      # autobuild, analyze and upload-sarif each got a PR of their own and three
      # of the four were red. Keeping them in one group is the remedy GitHub's
      # own error message points to.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      # Everything else: routine bumps arrive as a single PR, while a major
      # version still comes on its own so it gets read before it lands.
      actions-minor:
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "pip"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "BenjaminPellieux"
    # Group minor/patch updates to reduce PR noise
    groups:
      dev-dependencies:
        dependency-type: "direct"
        update-types: ["minor", "patch"]
        exclude-patterns:
          - "homeassistant"
          - "mistralai"
