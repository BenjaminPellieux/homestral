version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "BenjaminPellieux"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "pip"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "BenjaminPellieux"
    # Group minor/patch updates to reduce PR noise
    groups:
      dev-dependencies:
        dependency-type: "direct"
        update-types: ["minor", "patch"]
        exclude-patterns:
          - "homeassistant"
          - "mistralai"
