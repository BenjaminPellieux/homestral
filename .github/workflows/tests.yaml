name: Tests

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor declared in hacs.json, so the promise is actually tested.
          - homeassistant: "==2026.2.3"
            name: minimum
          - homeassistant: ""
            name: latest
    name: pytest (${{ matrix.name }} Home Assistant)
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: scripts/setup
      - name: Pin the minimum Home Assistant release
        if: matrix.homeassistant != ''
        run: |
          python -m pip install "homeassistant${{ matrix.homeassistant }}"
          scripts/setup
      - name: Run tests
        run: pytest -q
