name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://github.com/BenjaminPellieux/homestral/releases/tag/${{ github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that manifest version matches the tag
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/homestral/manifest.json'))['version'])")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "manifest.json version ($version) does not match tag ($GITHUB_REF_NAME)"
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
