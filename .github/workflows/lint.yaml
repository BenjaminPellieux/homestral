name: Lint

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Ruff check
        uses: astral-sh/ruff-action@v3
        with:
          args: check .
      - name: Ruff format
        uses: astral-sh/ruff-action@v3
        with:
          args: format --check .
