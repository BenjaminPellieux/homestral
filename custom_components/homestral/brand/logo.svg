<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1056 256" width="1056" height="256">
  <title>HomeStral</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA33A"/>
      <stop offset="1" stop-color="#E4461B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F7832C"/>
      <stop offset="1" stop-color="#E4461B"/>
    </linearGradient>
  </defs>
  <!-- icon -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- the house: Home Assistant -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="18">
    <path d="M36 124 L128 48 L220 124"/>
    <path d="M58 112 V208 H198 V112"/>
  </g>
  <!-- the cat: Mistral, in pixel art -->
  <g fill="#FFFFFF" shape-rendering="crispEdges">
    <rect x="79" y="104" width="9" height="9"/>
    <rect x="169" y="104" width="9" height="9"/>
    <rect x="79" y="113" width="18" height="9"/>
    <rect x="160" y="113" width="18" height="9"/>
    <rect x="79" y="122" width="36" height="9"/>
    <rect x="142" y="122" width="36" height="9"/>
    <rect x="79" y="131" width="99" height="9"/>
    <rect x="79" y="140" width="99" height="9"/>
    <rect x="79" y="149" width="18" height="9"/>
    <rect x="115" y="149" width="27" height="9"/>
    <rect x="160" y="149" width="18" height="9"/>
    <rect x="79" y="158" width="18" height="9"/>
    <rect x="115" y="158" width="27" height="9"/>
    <rect x="160" y="158" width="18" height="9"/>
    <rect x="79" y="167" width="45" height="9"/>
    <rect x="133" y="167" width="45" height="9"/>
    <rect x="88" y="176" width="81" height="9"/>
    <rect x="97" y="185" width="63" height="9"/>
  </g>
  <!-- wordmark -->
  <text x="304" y="178" font-family="Montserrat, 'DejaVu Sans', sans-serif" font-weight="800" font-size="132" letter-spacing="-2">
    <tspan fill="#1F2933">Home</tspan><tspan fill="url(#accent)">Stral</tspan>
  </text>
</svg>
