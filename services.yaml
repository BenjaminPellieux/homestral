send_message:
  name: Send message
  description: Send a message to Mistral chat
  fields:
    message:
      name: Message
      description: The message to send
      required: true
      example: "Bonjour, comment ça va ?"

speak:
  name: Speak
  description: Convert text to speech using Mistral VOXTRAL
  fields:
    text:
      name: Text
      description: The text to convert to speech
      required: true
      example: "Bonjour, comment puis-je vous aider ?"

